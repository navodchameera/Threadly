<html>
    <head>
        <title>Threadly Sign Up</title>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel = "stylesheet" type = "text/css" href = "css/styles.css">
        <script type = "text/javascript" src = "js/registererrors.js" defer></script>
        <script type = "text/javascript" src = "js/validatesignup.js"></script>
        <script type = "text/javascript" src = "js/togglepassword.js"></script>
    </head>
    <body>
        <form name = "formSignUp" action = "register.php" method = "post">
            <table id = "layout">
                <tr>
                    <td class = "login-info">
                        <table>
                            <tr>
                                <td class = "name">Threadly</td>
                            </tr>
                            <tr>
                                <td class = "motto">Ask. Answer. <br>Solve together.</td>
                            </tr>
                            <tr>
                                <td id = "description">A friendly community forum where every question finds a helpful answer.</td>
                            </tr>
                        </table>
                    </td>
                
                    <td class = "login-details-background">
                        <table class = "login-details">
                            <tr>
                                <td class = "login-title">Sign Up</td>
                            </tr>
                            <tr>
                                <td class = "input-names">Username</td>
                            </tr>
                            <tr>
                                <td class = "input-cells"><input type = "text" placeholder = "username" name = "username" class = "textbox"></td>
                            </tr>
                            <tr>
                                <td><p id = "errorUsername" class = "error"></p></td>
                            </tr>
                            <tr>
                                <td class = "input-names">Email</td>
                            </tr>
                            <tr>
                                <td class = "input-cells"><input type = "text" placeholder = "email" name = "email" class = "textbox"></td>
                            </tr>
                             <tr>
                                <td><p id = "errorEmail" class = "error"></p></td>
                            </tr>
                            <tr>
                                <td class = "input-names">Password</td>
                            </tr>
                            <tr>
                                <td class = "input-cells">
                                    <div class="password-container">
                                        <input type = "password" placeholder = "password" name = "password" id="password" class = "textbox">
                                    </div>
                                    
                                </td>
                            </tr>
                             <tr>
                                <td><p id = "errorPassword" class = "error"></p></td>
                            </tr>
                            <tr>
                                <td class = "input-names">Confirm Password</td>
                            </tr>
                            <tr>
                                <td class = "input-cells">
                                    <div class="password-container">
                                        <input type = "password" placeholder = "confirm password" name = "confirmPassword" class = "textbox">
                                    </div>
                                </td>
                            </tr>
                             <tr>
                                <td><p id = "errorConfirmPassword" class = "error"></p></td>
                            </tr>
                            <tr>
                                <td><input type = "submit" value = "Sign Up" class = "login-button"></td>
                            </tr>
                            
        
                            <tr>
                                <td class = "switch-login">Already use Threadly?&nbsp;&nbsp;<a href = "index.html" class = "switch-link">Login</a></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </form>
    </body>

</html>
