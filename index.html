<html>
    <head>
        <title>Threadly Login</title>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel = "stylesheet" type = "text/css" href = "/css/styles.css">
    </head>
    <body>
        <form name = "formLogin" action = "" method = "post">
            <table id = "layout">
                <tr>
                    <td class = "login-details">
                        <table>
                            <tr>
                                <td class = "name">Threadly</td>
                            </tr>
                            <tr>
                                <td class = "motto">Ask. Answer. <br>Solve together.</td>
                            </tr>
                            <tr>
                                <td>A friendly community forum where every question finds a helpful answer.</td>
                            </tr>
                        </table>
                    </td>
                
                    <td>
                        <table align = "center" border = "1">
                            <tr>
                                <td align = "center">Login</td>
                            </tr>
                            <tr>
                                <td>Username</td>
                            </tr>
                            <tr>
                                <td><input type = "text" placeholder = "Username"></td>
                            </tr>
                            <tr>
                                <td>Password</td>
                            </tr>
                            <tr>
                                <td><input type = "text" placeholder = "Password"></td>
                            </tr>
                            <tr>
                                <td align = "center"><input type = "submit" value = "Login"></td>
                            </tr>
                            <tr>
                                <td>New to Threadly? <a href = "signup" >Sign Up</a></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </form>
    </body>

</html>
